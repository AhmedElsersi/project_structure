# Lint rules for apps created from flutter_template.
#
# Source: markspulse analysis_options.yaml (strict analyzer modes + rule set;
#         `invalid_override_of_non_virtual_member: error`). CI runs
#         `flutter analyze --fatal-infos`.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  errors:
    # A guarded base-class method must never be overridden (see BaseCubit.run).
    invalid_override_of_non_virtual_member: error
    missing_required_param: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - "lib/core/localization/generated/**"

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    avoid_relative_lib_imports: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unawaited_futures: true
    unnecessary_lambdas: true
    use_build_context_synchronously: true
    use_super_parameters: true
    # Private fields can't be named initializing formals (markspulse disables it too).
    prefer_initializing_formals: false
